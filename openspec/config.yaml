schema: spec-driven

context: |
  Tech stack: Next.js 16.3.3, React 19.2.8, TypeScript 5, Tailwind v4 (@tailwindcss/postcss), ESLint 9 (eslint-config-next)
  Architecture: Single-page retro desktop OS — App Router `app/page.tsx` mounts MobileFrame + DesktopEnvironment via CSS visibility swap; shell core `lib/shell.ts` (COMMANDS + useShell) shared by both chromes; WM monolith `components/desktop/DesktopEnvironment.tsx` (z-order, pointer-capture drag, 8-dir resize writes DOM directly); presentational `components/ui/Window.tsx`; layered CSS (`@theme` outside layer, rest in layer(components))
  Testing: No test runner, no coverage, no CI; Linter `npm run lint` (eslint); Type checker `npx tsc --noEmit`; Formatter none; strict_tdd disabled
  Style: Tokens in `styles/theme.css`, `@/*` -> repo root, `// ponytail:` marks intentional simplifications, no literal color/size/spacing inline, `--breakpoint-desktop` (900px) duplicated in JS + CSS
  Persistence: artifact_store.mode `hybrid` (openspec + engram + droids-mem sync), delivery `single-pr`, execution `interactive`, review_budget `800`

rules:
  proposal:
    - Include rollback plan for risky changes
    - Flag `api/github-html` fragility (scrapes GitHub markup) on any change touching it
  specs:
    - Use Given/When/Then for scenarios
    - Use RFC 2119 keywords (MUST, SHALL, SHOULD, MAY)
    - One capability per domain file under specs/{domain}/spec.md
  design:
    - Include sequence diagrams for complex flows
    - Document architecture decisions with rationale
    - Note DOM-direct drag/resize invariant (no setState per pointermove) and dual-mount side-effect constraint
  tasks:
    - Group by phase, use hierarchical numbering
    - Keep tasks completable in one session
    - Co-locate tests/docs with code per work-unit-commits
  apply:
    guidelines:
      - Follow existing code patterns (shell core, WM monolith, layered CSS)
      - Keep side effects idempotent for dual-mounted Mobile + Desktop trees
      - Preserve `latest` popup sync semantics (window.open in user gesture tick)
    tdd: false
    test_command: ""
  verify:
    test_command: ""
    build_command: "npm run build"
    coverage_threshold: 0
  archive:
    - Warn before merging destructive deltas

# Testing capabilities — mirrors sdd/mol3ro/testing-capabilities (engram topic sdd/mol3ro/testing-capabilities)
testing:
  strict_tdd: false
  strict_tdd_reason: "No test runner detected — package.json has no jest/vitest/playwright/cypress and no test files; TDD cannot be enforced until a runner is added."
  runner:
    available: false
    command: ""
    framework: ""
  layers:
    unit: { available: false, tool: "—" }
    integration: { available: false, tool: "—" }
    e2e: { available: false, tool: "—" }
  coverage:
    available: false
    command: "—"
  quality:
    linter: { available: true, command: "npm run lint" }
    type_checker: { available: true, command: "npx tsc --noEmit" }
    formatter: { available: false, command: "—" }
  detected: "2026-09-01"
